<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Дискотека ПГТ Стрижи | Голосование</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0a0a12;
      --panel: rgba(18, 18, 30, 0.85);
      --text: #f0ecff;
      --accent: #b57aff;
      --accent2: #6dc5ff;
      --danger: #ff5e5e;
      --success: #3dd68c;
      --warning: #f0a040;
      --border: rgba(255,255,255,0.08);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse at 25% 15%, rgba(130, 60, 230, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 85%, rgba(0, 180, 240, 0.1) 0%, transparent 55%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      color: var(--text);
      position: relative;
    }

    /* Основная панель */
    .main-panel {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 22px 16px 26px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.65);
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #d9b3ff, #7dc9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }
    .header .school {
      font-size: 0.85rem;
      color: #a8a0cc;
      font-weight: 600;
    }
    .header .date {
      font-size: 0.7rem;
      color: #7c7c9e;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #8a8aa8;
      margin-top: 2px;
    }

    /* Таймер */
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 30px;
      padding: 8px 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .timer {
      font-weight: 700;
      font-size: 1.1rem;
      color: #dacfff;
      font-variant-numeric: tabular-nums;
    }
    .timer.warning { color: #ff9f7c; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(60, 220, 110, 0.2);
      color: #5ce0a0;
      border: 1px solid rgba(60,220,110,0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .badge.off {
      background: rgba(255,160,60,0.2);
      color: #ffa84d;
      border-color: rgba(255,160,60,0.3);
    }

    /* Поиск */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .search-box input {
      flex: 1;
      background: rgba(10,10,18,0.7);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 14px 16px;
      font-size: 0.95rem;
      color: #fff;
      outline: none;
      backdrop-filter: blur(8px);
    }
    .search-box input:focus {
      border-color: #a86eff;
      box-shadow: 0 0 0 3px rgba(168,110,255,0.2);
    }
    .search-box input::placeholder { color: #52526e; }
    .search-box input:disabled { opacity: 0.4; pointer-events: none; }

    button {
      border: none;
      border-radius: 40px;
      padding: 14px 18px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
    }
    button:active:not(:disabled) { transform: scale(0.94); }
    button:disabled { opacity: 0.4; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(105deg, #c69bff, #87c8ff);
      color: #0a0a16;
      box-shadow: 0 8px 18px rgba(130,80,240,0.35);
    }
    .btn-sm {
      background: rgba(255,255,255,0.07);
      color: #ddd;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 14px;
      font-size: 0.75rem;
    }
    .btn-danger { background: rgba(255,80,80,0.2); color: #ffaaaa; border: 1px solid rgba(255,100,100,0.35); }
    .btn-success { background: rgba(60,200,100,0.2); color: #7ce0a0; border: 1px solid rgba(60,200,100,0.35); }

    /* Список треков */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 16px;
    }
    .track-item {
      background: rgba(14,14,22,0.8);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 22px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
    .track-cover {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
      background: #1a1a2a;
    }
    .track-info { flex: 1; min-width: 0; }
    .track-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: #eceaff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.7rem;
      color: #8a80b0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .preview-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
      color: #cbb5ff;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .preview-btn:hover { background: rgba(200,170,255,0.2); }
    .vote-btn {
      border: 1.5px solid rgba(255,255,255,0.22);
      border-radius: 30px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.85rem;
      color: #efebff;
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }
    .vote-btn.voted {
      background: rgba(180,130,255,0.3);
      border-color: #b77bff;
      box-shadow: 0 0 12px rgba(170,110,255,0.4);
    }
    .vote-btn:disabled { opacity: 0.35; pointer-events: none; }

    /* Админ */
    .admin-area { display: flex; justify-content: center; margin-top: 14px; }
    .dj-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(20,18,32,0.85);
      border: 2px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    .dj-avatar svg { width: 28px; height: 28px; fill: #dacfff; }
    .dj-avatar:active { transform: scale(0.9); }

    .admin-panel {
      margin-top: 14px;
      padding: 16px;
      background: rgba(8,6,16,0.9);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.22);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeSlide 0.3s;
    }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } }
    .hidden { display: none !important; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row input { flex: 1; min-width: 100px; padding: 10px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.5); color: #fff; font-size: 0.8rem; }
    .row input[type="date"] { color-scheme: dark; }
    .note { font-size: 0.65rem; color: #7a7a9e; }

    /* Объявление */
    .ann-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.4s;
    }
    .ann-overlay.fade-out { animation: fadeOut 0.8s forwards; }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; } }
    .ann-card {
      background: rgba(18,16,30,0.95);
      border: 2px solid rgba(200,170,255,0.5);
      border-radius: 30px;
      padding: 28px 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 70px rgba(150,100,255,0.5);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } }
    .ann-icon { font-size: 3rem; margin-bottom: 10px; }
    .ann-msg { font-size: 1.3rem; font-weight: 700; color: #e0d5ff; line-height: 1.4; }

    /* Модалка выбора трека */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      animation: fadeIn 0.3s;
    }
    .modal-card {
      background: rgba(20,18,34,0.97);
      border: 2px solid #b77bff;
      border-radius: 28px;
      padding: 20px 16px;
      max-width: 420px;
      width: 94%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 0 60px rgba(150,100,255,0.4);
    }
    .modal-title {
      font-weight: 800;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 14px;
      color: #e0d5ff;
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      margin-bottom: 8px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
    }
    .result-item:hover { background: rgba(180,140,255,0.1); border-color: rgba(180,140,255,0.3); }
    .result-cover { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
    .result-info { flex: 1; min-width: 0; }
    .result-name { font-weight: 700; font-size: 0.9rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-artist { font-size: 0.7rem; color: #a098c0; }
    .result-preview { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); color: #cbb5ff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
    .manual-btn { width: 100%; margin-top: 10px; }

    .track-list::-webkit-scrollbar, .modal-card::-webkit-scrollbar { width: 4px; }
    .track-list::-webkit-scrollbar-thumb, .modal-card::-webkit-scrollbar-thumb { background: #3a3550; border-radius: 10px; }

    @media (max-width: 380px) {
      .main-panel { padding: 16px 12px 20px; }
    }
  </style>
</head>
<body>

  <!-- Объявление -->
  <div id="annOverlay" class="ann-overlay hidden">
    <div class="ann-card">
      <div class="ann-icon">📢</div>
      <div class="ann-msg" id="annMsg"></div>
    </div>
  </div>

  <!-- Модалка результатов поиска -->
  <div id="searchModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-title">🔍 Найденные треки</div>
      <div id="searchResults"></div>
      <button class="btn-sm manual-btn" id="manualAddBtn">✍️ Ввести вручную (если не нашлось)</button>
      <button class="btn-sm manual-btn" id="closeSearchBtn" style="margin-top:4px;">✖️ Закрыть</button>
    </div>
  </div>

  <!-- Главная панель -->
  <div class="main-panel">
    <div class="header">
      <h1>Голосование на дискотеке</h1>
      <div class="school">Школа ПГТ Стрижи</div>
      <div class="date" id="headerDate">01.01.2025</div>
      <div class="subtitle">найди трек · подтверди · лайкни</div>
    </div>

    <div class="timer-row">
      <span>⏱️</span>
      <span class="timer" id="timerDisplay">05:00</span>
      <span class="badge" id="statusBadge">АКТИВНО</span>
    </div>

    <div class="search-box">
      <input type="text" id="songInput" placeholder="Название песни или исполнитель..." enterkeyhint="search">
      <button id="searchBtn" class="btn-primary">🔍 Найти</button>
    </div>

    <div class="track-list" id="trackList"></div>

    <div class="admin-area">
      <div class="dj-avatar" id="secretAvatar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="4"/><path d="M12 12c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5z"/></svg>
      </div>
    </div>

    <div id="adminPanel" class="admin-panel hidden">
      <strong style="color:#e2d5ff;">🔐 Админ</strong>
      <div class="row">
        <span style="font-size:0.75rem;">📅</span>
        <input type="date" id="adminDate">
        <button id="saveDateBtn" class="btn-sm">Ок</button>
      </div>
      <div class="row">
        <input type="text" id="annInput" placeholder="Объявление...">
        <button id="sendAnnBtn" class="btn-sm">📢</button>
      </div>
      <div class="row">
        <button id="pauseBtn" class="btn-sm">⏸️ Пауза</button>
        <button id="resumeBtn" class="btn-success" style="padding:8px 14px;">▶️ Играть</button>
      </div>
      <div class="row">
        <button id="endRoundBtn" class="btn-danger">⏹️ Завершить</button>
        <button id="resetVotesBtn" class="btn-sm">🔄 Сброс</button>
      </div>
      <div class="note">Пауза блокирует поиск и лайки. Завершение удаляет все треки.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove, get, child } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDjOn8OUYlnMjGWIqTIfHYpToltMfvpDLk",
      authDomain: "black-belt-9e72e.firebaseapp.com",
      databaseURL: "https://black-belt-9e72e-default-rtdb.firebaseio.com",
      projectId: "black-belt-9e72e",
      storageBucket: "black-belt-9e72e.firebasestorage.app",
      messagingSenderId: "838619528149",
      appId: "1:838619528149:web:2a275f4a90900e3d2e5b5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const songsRef = ref(db, 'songs');
    const settingsRef = ref(db, 'settings');
    const annRef = ref(db, 'announcement');

    // DOM
    const $ = id => document.getElementById(id);
    const songInput = $('songInput');
    const searchBtn = $('searchBtn');
    const trackList = $('trackList');
    const timerDisplay = $('timerDisplay');
    const statusBadge = $('statusBadge');
    const headerDate = $('headerDate');
    const adminDate = $('adminDate');
    const adminPanel = $('adminPanel');
    const searchModal = $('searchModal');
    const searchResults = $('searchResults');
    const annOverlay = $('annOverlay');
    const annMsg = $('annMsg');

    const VOTING_DURATION = 5 * 60;
    let votingEndTime = null, votingPaused = false, timerInterval = null, annTimeout = null;
    let currentPreviewAudio = null;

    // ---------- Реальный поиск через iTunes + Deezer ----------
    async function searchTracks(query) {
      const results = [];
      
      // 1. Поиск через iTunes API (надёжный, не требует ключа)
      try {
        const itunesRes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=5`);
        const itunesData = await itunesRes.json();
        if (itunesData.results) {
          for (const track of itunesData.results) {
            results.push({
              id: 'it_' + track.trackId,
              name: track.trackName || 'Без названия',
              artist: track.artistName || 'Неизвестен',
              cover: track.artworkUrl100 ? track.artworkUrl100.replace('100x100', '300x300') : '',
              preview: track.previewUrl || '',
              source: 'iTunes'
            });
          }
        }
      } catch (e) { console.warn('iTunes API error:', e); }

      // 2. Поиск через Deezer (если iTunes не дал результатов)
      if (results.length === 0) {
        try {
          const dzRes = await fetch(`https://api.deezer.com/search?q=${encodeURIComponent(query)}&limit=5`);
          const dzData = await dzRes.json();
          if (dzData.data) {
            for (const track of dzData.data) {
              results.push({
                id: 'dz_' + track.id,
                name: track.title || 'Без названия',
                artist: track.artist?.name || 'Неизвестен',
                cover: track.album?.cover_medium || '',
                preview: track.preview || '',
                source: 'Deezer'
              });
            }
          }
        } catch (e) { console.warn('Deezer API error:', e); }
      }

      // Убираем дубликаты по названию + исполнителю
      const unique = [];
      const seen = new Set();
      for (const r of results) {
        const key = (r.name + '|' + r.artist).toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(r);
        }
      }
      return unique.slice(0, 5);
    }

    // Показать модалку с результатами
    function showSearchModal(tracks) {
      searchResults.innerHTML = '';
      if (tracks.length === 0) {
        searchResults.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">😔 Ничего не найдено.<br>Попробуй другое название или введи вручную.</p>';
      } else {
        tracks.forEach(track => {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `
            <img class="result-cover" src="${escapeHTML(track.cover)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 50 50%22><rect fill=%22%23333%22 width=%2250%22 height=%2250%22 rx=%2212%22/><text fill=%22%23aaa%22 x=%2225%22 y=%2230%22 text-anchor=%22middle%22 font-size=%2216%22>🎵</text></svg>'">
            <div class="result-info">
              <div class="result-name">${escapeHTML(track.name)}</div>
              <div class="result-artist">${escapeHTML(track.artist)} · ${track.source}</div>
            </div>
            ${track.preview ? `<button class="result-preview preview-trigger" data-preview="${escapeHTML(track.preview)}">▶️</button>` : ''}
          `;
          
          // Клик по всему блоку = выбор трека
          div.addEventListener('click', (e) => {
            if (e.target.closest('.preview-trigger')) return; // не срабатывает при клике на кнопку
            selectTrack(track);
          });

          searchResults.appendChild(div);
        });

        // Кнопки превью
        searchResults.querySelectorAll('.preview-trigger').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            playPreview(btn.dataset.preview);
          });
        });
      }
      searchModal.classList.remove('hidden');
    }

    function selectTrack(track) {
      searchModal.classList.add('hidden');
      stopPreview();
      addSongToBase(track);
    }

    function playPreview(url) {
      stopPreview();
      currentPreviewAudio = new Audio(url);
      currentPreviewAudio.volume = 0.7;
      currentPreviewAudio.play().catch(() => {});
    }

    function stopPreview() {
      if (currentPreviewAudio) {
        currentPreviewAudio.pause();
        currentPreviewAudio = null;
      }
    }

    // Ручной ввод
    $('manualAddBtn').addEventListener('click', () => {
      searchModal.classList.add('hidden');
      stopPreview();
      const name = prompt("Введи название трека вручную:");
      if (!name || !name.trim()) return;
      const artist = prompt("Введи исполнителя (или оставь пустым):") || 'Неизвестен';
      addSongToBase({
        id: 'manual_' + Date.now(),
        name: name.trim(),
        artist: artist.trim(),
        cover: '',
        preview: '',
        source: 'Ручной ввод'
      });
    });

    $('closeSearchBtn').addEventListener('click', () => {
      searchModal.classList.add('hidden');
      stopPreview();
    });

    // Фильтр мата
    const badWords = ['хуй','пизда','ебать','блядь','блять','сука','нахер','нахуй','пошёл','пошел','залупа','жопа','говно','мудак','пидор','пидорас','гандон','шлюха','fuck','shit','bitch','asshole','dick','pussy','cunt'];
    function hasBadWords(t) {
      const l = t.toLowerCase().replace(/[^а-яёa-z0-9 ]/gi, '');
      return badWords.some(w => l.includes(w.replace(/[^а-яёa-z0-9 ]/gi, '')));
    }

    // Поиск
    searchBtn.addEventListener('click', async () => {
      const q = songInput.value.trim();
      if (!q) return alert("Введи название!");
      if (hasBadWords(q)) return alert("❌ Нецензурная лексика!");
      
      searchBtn.disabled = true;
      searchBtn.textContent = '⏳ Ищу...';
      const tracks = await searchTracks(q);
      searchBtn.disabled = false;
      searchBtn.textContent = '🔍 Найти';
      showSearchModal(tracks);
      songInput.value = '';
    });

    songInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') { e.preventDefault(); searchBtn.click(); }
    });

    // Добавление в Firebase
    async function addSongToBase(track) {
      const s = (await get(settingsRef)).val() || {};
      if (s.votingPaused) return alert("⏸️ Голосование на паузе.");
      if (s.roundEndTime && Date.now() >= s.roundEndTime) return alert("⏰ Раунд завершён.");

      const songs = (await get(songsRef)).val() || {};
      if (Object.keys(songs).length >= 5) return alert("🎵 Максимум 5 треков!");

      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      await set(ref(db, `songs/${id}`), {
        id,
        name: track.name,
        artist: track.artist,
        cover: track.cover,
        preview: track.preview,
        votes: 0
      });
    }

    // Настройки
    async function initSettings() {
      const snap = await get(settingsRef);
      if (!snap.exists()) {
        const now = Date.now();
        await set(settingsRef, {
          votingActive: true,
          votingPaused: false,
          roundEndTime: now + VOTING_DURATION * 1000,
          roundStarted: now,
          eventDate: '01.01.2025'
        });
      } else {
        const s = snap.val();
        if (s.eventDate) {
          headerDate.textContent = s.eventDate;
          adminDate.value = (s.eventDate.split('.').reverse().join('-'));
        }
      }
    }

    onValue(settingsRef, snap => {
      if (!snap.exists()) return;
      const s = snap.val();
      votingPaused = !!s.votingPaused;
      votingEndTime = s.roundEndTime || null;
      if (s.eventDate) headerDate.textContent = s.eventDate;
      updateUI();
    });

    onValue(annRef, snap => {
      if (!snap.exists()) return;
      const d = snap.val();
      if (d.message && d.timestamp && Date.now() - d.timestamp < 10000) {
        showAnnouncement(d.message);
        setTimeout(() => remove(annRef), 500);
      } else remove(annRef);
    });

    function showAnnouncement(msg) {
      if (annTimeout) clearTimeout(annTimeout);
      annMsg.textContent = msg;
      annOverlay.classList.remove('hidden', 'fade-out');
      annTimeout = setTimeout(() => {
        annOverlay.classList.add('fade-out');
        setTimeout(() => annOverlay.classList.add('hidden'), 800);
      }, 5000);
    }

    function updateUI() {
      const now = Date.now();
      const active = votingEndTime && now < votingEndTime && !votingPaused;
      searchBtn.disabled = !active;
      songInput.disabled = !active;
      statusBadge.textContent = votingPaused ? 'ПАУЗА' : (votingEndTime && now >= votingEndTime ? 'СТОП' : 'АКТИВНО');
      statusBadge.className = 'badge' + (active ? '' : ' off');
      document.querySelectorAll('.vote-btn').forEach(b => b.disabled = !active);
      updateTimer();
    }

    function updateTimer() {
      if (!votingEndTime) { timerDisplay.textContent = '--:--'; return; }
      const r = Math.max(0, Math.floor((votingEndTime - Date.now()) / 1000));
      timerDisplay.textContent = `${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;
      timerDisplay.classList.toggle('warning', r <= 60 && r > 0);
      if (r === 0) updateUI();
    }
    timerInterval = setInterval(updateTimer, 1000);

    // Локальные голоса
    const SK = 'disco_voted_songs';
    function getVoted() { try { return JSON.parse(localStorage.getItem(SK)||'{}'); } catch { return {}; } }
    function markVoted(id) { const v=getVoted(); v[id]=true; localStorage.setItem(SK,JSON.stringify(v)); }
    function hasVoted(id) { return !!getVoted()[id]; }
    function clearVoted() { localStorage.removeItem(SK); }

    // Голосование
    window.voteForSong = async function(id, votes) {
      const s = (await get(settingsRef)).val()||{};
      if (s.votingPaused) return alert("⏸️ Пауза.");
      if (s.roundEndTime && Date.now() >= s.roundEndTime) return alert("⏰ Время вышло.");
      if (hasVoted(id)) return alert("⏳ Уже лайкнул этот трек!");
      await update(ref(db, `songs/${id}`), { votes: votes + 1 });
      markVoted(id);
      return true;
    };

    window.playPreviewGlobal = function(url) {
      if (!url) return alert("Нет превью.");
      stopPreview();
      playPreview(url);
    };

    // Отображение треков
    onValue(songsRef, snap => {
      trackList.innerHTML = '';
      if (snap.exists()) {
        Object.values(snap.val()).sort((a,b) => b.votes - a.votes).forEach(track => {
          const div = document.createElement('div');
          div.className = 'track-item';
          div.innerHTML = `
            <img class="track-cover" src="${escapeHTML(track.cover)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect fill=%22%23222%22 width=%2248%22 height=%2248%22 rx=%2214%22/><text fill=%22%23999%22 x=%2224%22 y=%2228%22 text-anchor=%22middle%22 font-size=%2216%22>🎵</text></svg>'">
            <div class="track-info">
              <div class="track-name">${escapeHTML(track.name)}</div>
              <div class="track-artist">${escapeHTML(track.artist)}</div>
            </div>
            <div class="track-actions">
              ${track.preview ? `<button class="preview-btn" data-preview="${escapeHTML(track.preview)}">▶️</button>` : ''}
              <button class="vote-btn ${hasVoted(track.id)?'voted':''}" data-id="${track.id}" data-votes="${track.votes}">
                ❤️ <span>${track.votes}</span>
              </button>
            </div>`;
          trackList.appendChild(div);
        });

        trackList.querySelectorAll('.vote-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id=btn.dataset.id, v=parseInt(btn.dataset.votes);
            btn.style.transform='scale(1.2)'; setTimeout(()=>btn.style.transform='',150);
            if (await window.voteForSong(id, v)) {
              btn.classList.add('voted');
              btn.querySelector('span').textContent = v+1;
              btn.dataset.votes = v+1;
            }
          });
        });

        trackList.querySelectorAll('.preview-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            window.playPreviewGlobal(btn.dataset.preview);
          });
        });
      } else {
        trackList.innerHTML = '<div style="padding:28px;text-align:center;color:#6b6b80;font-size:0.9rem;">🎤 Пока никто не предложил трек.<br>Найди и добавь первый!</div>';
      }
      updateUI();
    });

    // Админка
    let clicks=0, ct=null;
    $('secretAvatar').addEventListener('click', () => {
      clicks++;
      if(ct) clearTimeout(ct);
      ct=setTimeout(()=>clicks=0,2000);
      if(clicks>=5){
        clicks=0;
        const pw=prompt("🔐 Пароль:");
        if(pw==="27172930") adminPanel.classList.remove('hidden');
        else if(pw!==null) alert("❌ Неверно!");
      }
    });

    $('saveDateBtn').addEventListener('click', async () => {
      const d = adminDate.value;
      if(!d) return;
      const disp = d.split('-').reverse().join('.');
      await update(settingsRef, { eventDate: disp });
      headerDate.textContent = disp;
    });

    $('sendAnnBtn').addEventListener('click', async () => {
      const msg = $('annInput').value.trim();
      if(!msg) return;
      await set(annRef, { message: msg, timestamp: Date.now() });
      $('annInput').value = '';
    });

    $('pauseBtn').addEventListener('click', async () => { await update(settingsRef, { votingPaused: true }); });
    $('resumeBtn').addEventListener('click', async () => { await update(settingsRef, { votingPaused: false }); });

    $('endRoundBtn').addEventListener('click', async () => {
      if(!confirm('⏹️ Завершить опрос и удалить ВСЕ треки?')) return;
      await remove(songsRef);
      const now = Date.now();
      await set(settingsRef, {
        votingActive: true,
        votingPaused: false,
        roundEndTime: now + VOTING_DURATION * 1000,
        roundStarted: now,
        eventDate: headerDate.textContent
      });
      clearVoted();
      stopPreview();
    });

    $('resetVotesBtn').addEventListener('click', async () => {
      if(!confirm('🔄 Сбросить все лайки?')) return;
      const snap = await get(songsRef);
      if(snap.exists()) {
        const u = {};
        Object.keys(snap.val()).forEach(k => u[`songs/${k}/votes`] = 0);
        await update(ref(db), u);
        clearVoted();
      }
    });

    function escapeHTML(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    initSettings();
  </script>
</body>
</html>
