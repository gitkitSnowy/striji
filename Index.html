<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Дискотека ПГТ Стрижи | Голосование</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080e;
      --bg2: #12121e;
      --panel: rgba(18, 18, 30, 0.85);
      --text: #f0ecff;
      --text2: #9a96b8;
      --accent: #b57aff;
      --accent2: #6dc5ff;
      --danger: #ff5e5e;
      --success: #3dd68c;
      --warning: #f0a040;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.15);
      --shadow: 0 25px 60px rgba(0,0,0,0.65);
      --glow: 0 0 40px rgba(150,100,255,0.3);
      --radius: 32px;
      --radius-sm: 20px;
      --radius-xs: 14px;
    }

    [data-theme="light"] {
      --bg: #f0edf8;
      --bg2: #e8e4f4;
      --panel: rgba(255, 255, 255, 0.9);
      --text: #1a1a2e;
      --text2: #5a5678;
      --accent: #7c3aed;
      --accent2: #3b82f6;
      --border: rgba(0,0,0,0.08);
      --border2: rgba(0,0,0,0.12);
      --shadow: 0 20px 50px rgba(0,0,0,0.1);
      --glow: 0 0 30px rgba(124,58,237,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse at 25% 15%, var(--accent) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 85%, var(--accent2) 0%, transparent 55%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      color: var(--text);
      position: relative;
      transition: background 0.4s, color 0.4s;
    }

    /* Кастомный SVG эмодзи спрайт */
    .emoji {
      display: inline-block;
      width: 1.2em;
      height: 1.2em;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .emoji-lg { width: 2em; height: 2em; }
    .emoji-xl { width: 3em; height: 3em; }
    .emoji-xxl { width: 5em; height: 5em; }

    /* Основная панель */
    .main-panel {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 16px 26px;
      box-shadow: var(--shadow);
      z-index: 1;
      transition: all 0.4s;
      position: relative;
    }

    /* Тема и QR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .theme-toggle, .qr-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border2);
      background: var(--bg2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      color: var(--text2);
    }
    .theme-toggle:hover, .qr-btn:hover { border-color: var(--accent); }
    .online-counter {
      font-size: 0.7rem;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: onlinePulse 2s infinite;
    }
    @keyframes onlinePulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }
    .header .school {
      font-size: 0.8rem;
      color: var(--text2);
      font-weight: 600;
    }
    .header .date {
      font-size: 0.7rem;
      color: var(--text2);
      opacity: 0.7;
    }
    .subtitle {
      font-size: 0.7rem;
      color: var(--text2);
      opacity: 0.8;
      margin-top: 2px;
    }

    /* Таймер */
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg2);
      border-radius: 30px;
      padding: 8px 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      transition: 0.3s;
    }
    .timer {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .timer.warning { color: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(60, 220, 110, 0.15);
      color: var(--success);
      border: 1px solid rgba(60,220,110,0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .badge.off {
      background: rgba(240,160,64,0.15);
      color: var(--warning);
      border-color: rgba(240,160,64,0.3);
    }

    /* Поиск */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .search-box input {
      flex: 1;
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: 0.3s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168,110,255,0.15);
    }
    .search-box input::placeholder { color: var(--text2); opacity: 0.5; }
    .search-box input:disabled { opacity: 0.4; pointer-events: none; }

    button {
      border: none;
      border-radius: 40px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      -webkit-user-select: none;
      user-select: none;
      font-family: inherit;
    }
    button:active:not(:disabled) { transform: scale(0.94); }
    button:disabled { opacity: 0.4; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 6px 20px rgba(130,80,240,0.3);
    }
    .btn-sm {
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border2);
      padding: 8px 14px;
      font-size: 0.7rem;
    }
    .btn-sm:hover { border-color: var(--accent); }
    .btn-danger { background: rgba(255,80,80,0.15); color: var(--danger); border: 1px solid rgba(255,100,100,0.3); }
    .btn-success { background: rgba(60,200,100,0.15); color: var(--success); border: 1px solid rgba(60,200,100,0.3); }

    /* Топ-чарт */
    .top-chart {
      background: var(--bg2);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      transition: 0.3s;
    }
    .top-title {
      font-weight: 800;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-xs);
      transition: 0.3s;
      animation: slideIn 0.5s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
    }
    .top-item:nth-child(1) { animation-delay: 0s; }
    .top-item:nth-child(2) { animation-delay: 0.1s; }
    .top-item:nth-child(3) { animation-delay: 0.2s; }
    .top-rank {
      font-weight: 900;
      font-size: 1.2rem;
      width: 32px;
      text-align: center;
      flex-shrink: 0;
    }
    .top-rank.gold { color: var(--gold); }
    .top-rank.silver { color: var(--silver); }
    .top-rank.bronze { color: var(--bronze); }
    .top-info { flex: 1; min-width: 0; }
    .top-name {
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-artist {
      font-size: 0.65rem;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-votes {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .crown {
      animation: crownBounce 0.8s ease infinite alternate;
    }
    @keyframes crownBounce {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-6px) rotate(5deg); }
    }

    /* Список треков */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 14px;
    }
    .track-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.3s ease;
      transition: 0.3s;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }
    .track-cover {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-xs);
      object-fit: cover;
      border: 1px solid var(--border2);
      flex-shrink: 0;
      background: var(--bg);
    }
    .track-info { flex: 1; min-width: 0; }
    .track-name {
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.65rem;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .preview-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border2);
      background: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      color: var(--accent);
    }
    .preview-btn:hover { background: rgba(180,140,255,0.15); }
    .vote-btn {
      border: 1.5px solid var(--border2);
      border-radius: 30px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 0.8rem;
      background: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.3s;
      color: var(--text);
    }
    .vote-btn.voted {
      background: rgba(180,130,255,0.25);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(170,110,255,0.3);
    }
    .vote-btn:disabled { opacity: 0.35; pointer-events: none; }

    /* Админ */
    .admin-area { display: flex; justify-content: center; margin-top: 8px; }
    .dj-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg2);
      border: 2px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .dj-avatar:hover { border-color: var(--accent); }
    .dj-avatar:active { transform: scale(0.9); }

    .admin-panel {
      margin-top: 12px;
      padding: 16px;
      background: var(--bg2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeSlide 0.3s;
    }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } }
    .hidden { display: none !important; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .row input {
      flex: 1;
      min-width: 100px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border2);
      background: var(--bg);
      color: var(--text);
      font-size: 0.75rem;
      font-family: inherit;
      transition: 0.3s;
    }
    .row input:focus { border-color: var(--accent); outline: none; }
    .row input[type="date"] { color-scheme: dark; }
    [data-theme="light"] .row input[type="date"] { color-scheme: light; }
    .note { font-size: 0.6rem; color: var(--text2); opacity: 0.7; }

    /* Объявление */
    .ann-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeIn 0.4s;
    }
    .ann-overlay.fade-out { animation: fadeOut 0.8s forwards; }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; } }
    .ann-card {
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 28px 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: var(--glow);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } }
    .ann-msg { font-size: 1.3rem; font-weight: 700; color: var(--text); line-height: 1.4; }

    /* QR модалка */
    .qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9997;
    }
    .qr-card {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .qr-card canvas { border-radius: 12px; }
    .qr-url {
      margin-top: 10px;
      font-weight: 700;
      font-size: 0.8rem;
      color: #333;
      word-break: break-all;
    }

    /* Модалка поиска */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      animation: fadeIn 0.3s;
    }
    .modal-card {
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px 16px;
      max-width: 440px;
      width: 94%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--glow);
    }
    .modal-title {
      font-weight: 800;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 14px;
      color: var(--text);
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-xs);
      background: var(--bg2);
      margin-bottom: 6px;
      cursor: pointer;
      transition: 0.25s;
      border: 1px solid transparent;
    }
    .result-item:hover {
      background: rgba(180,140,255,0.08);
      border-color: rgba(180,140,255,0.3);
    }
    .result-cover {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-name {
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-artist {
      font-size: 0.65rem;
      color: var(--text2);
    }
    .result-preview {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border2);
      background: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--accent);
    }
    .manual-btn {
      width: 100%;
      margin-top: 8px;
    }

    .track-list::-webkit-scrollbar,
    .modal-card::-webkit-scrollbar { width: 3px; }
    .track-list::-webkit-scrollbar-thumb,
    .modal-card::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

    /* Победитель */
    .winner-glow {
      animation: winnerGlow 1.5s ease-in-out infinite alternate;
    }
    @keyframes winnerGlow {
      0% { box-shadow: 0 0 10px var(--gold); }
      100% { box-shadow: 0 0 30px var(--gold), 0 0 60px var(--accent); }
    }

    @media (max-width: 380px) {
      .main-panel { padding: 16px 10px 18px; border-radius: 24px; }
      .header h1 { font-size: 1.2rem; }
    }
  </style>
</head>

  <!-- Объявление -->

  <!-- Модалка поиска -->
  <div id="searchModal" class="modal-overlay hidden">

  <!-- Главная панель -->
  <div class="main-panel">

  <!-- Звук оповещения -->
  <audio id="notifySound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CAf39/f4B/f3+AgH9/f3+Af39/gIB/f39/gH9/f4CA" type="audio/wav">
  </audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove, get, child, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDjOn8OUYlnMjGWIqTIfHYpToltMfvpDLk",
      authDomain: "black-belt-9e72e.firebaseapp.com",
      databaseURL: "https://black-belt-9e72e-default-rtdb.firebaseio.com",
      projectId: "black-belt-9e72e",
      storageBucket: "black-belt-9e72e.firebasestorage.app",
      messagingSenderId: "838619528149",
      appId: "1:838619528149:web:2a275f4a90900e3d2e5b5c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const songsRef = ref(db, 'songs');
    const settingsRef = ref(db, 'settings');
    const annRef = ref(db, 'announcement');
    const onlineRef = ref(db, 'online');

    const $ = id => document.getElementById(id);
    const songInput = $('songInput');
    const searchBtn = $('searchBtn');
    const trackList = $('trackList');
    const topList = $('topList');
    const timerDisplay = $('timerDisplay');
    const statusBadge = $('statusBadge');
    const headerDate = $('headerDate');
    const adminDate = $('adminDate');
    const adminPanel = $('adminPanel');
    const searchModal = $('searchModal');
    const searchResults = $('searchResults');
    const annOverlay = $('annOverlay');
    const annMsg = $('annMsg');
    const onlineCount = $('onlineCount');
    const themeToggle = $('themeToggle');
    const themeIcon = $('themeIcon');
    const notifySound = $('notifySound');

    const VOTING_DURATION = 5 * 60;
    let votingEndTime = null, votingPaused = false, timerInterval = null, annTimeout = null;
    let currentPreviewAudio = null;
    let myOnlineRef = null;

    // ---------- Онлайн счётчик ----------
    const userId = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    myOnlineRef = ref(db, `online/${userId}`);
    
    function setupOnline() {
      set(myOnlineRef, { ts: serverTimestamp() });
      onDisconnect(myOnlineRef).remove();
      setInterval(() => {
        set(myOnlineRef, { ts: serverTimestamp() });
      }, 30000);
    }

    onValue(onlineRef, (snap) => {
      const count = snap.exists() ? Object.keys(snap.val()).length : 0;
      onlineCount.textContent = count;
    });

    setupOnline();

    // ---------- Тема ----------
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('disco_theme', theme);
      const icon = theme === 'dark' ? 'emoji-sun' : 'emoji-moon';
      themeIcon.querySelector('use').setAttribute('href', '#' + icon);
    }

    const savedTheme = localStorage.getItem('disco_theme') || 'dark';
    setTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ---------- QR-код ----------
    $('qrBtn').addEventListener('click', () => {
      const url = window.location.href;
      $('qrUrl').textContent = url;
      $('qrOverlay').classList.remove('hidden');
      
      // Генерируем QR через API
      const canvas = $('qrCanvas');
      canvas.width = 200;
      canvas.height = 200;
      const ctx = canvas.getContext('2d');
      
      // Простой QR через внешний сервис
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&bgcolor=ffffff&color=000000`;
      img.onload = () => {
        ctx.clearRect(0, 0, 200, 200);
        ctx.drawImage(img, 0, 0);
      };
      img.onerror = () => {
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, 200, 200);
        ctx.fillStyle = '#999';
        ctx.font = '12px Inter';
        ctx.textAlign = 'center';
        ctx.fillText('QR не загрузился', 100, 100);
        ctx.fillText(url, 100, 120);
      };
    });

    // ---------- Поиск треков ----------
    async function searchTracks(query) {
      const results = [];
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=5`);
        const data = await res.json();
        if (data.results) {
          for (const t of data.results) {
            results.push({
              id: 'it_' + t.trackId,
              name: t.trackName || 'Без названия',
              artist: t.artistName || 'Неизвестен',
              cover: t.artworkUrl100?.replace('100x100', '300x300') || '',
              preview: t.previewUrl || '',
              source: 'iTunes'
            });
          }
        }
      } catch (e) {}
      
      if (results.length === 0) {
        try {
          const res = await fetch(`https://api.deezer.com/search?q=${encodeURIComponent(query)}&limit=5`);
          const data = await res.json();
          if (data.data) {
            for (const t of data.data) {
              results.push({
                id: 'dz_' + t.id,
                name: t.title || '',
                artist: t.artist?.name || '',
                cover: t.album?.cover_medium || '',
                preview: t.preview || '',
                source: 'Deezer'
              });
            }
          }
        } catch (e) {}
      }

      return results.filter((r, i, arr) => 
        arr.findIndex(x => (x.name + x.artist).toLowerCase() === (r.name + r.artist).toLowerCase()) === i
      ).slice(0, 5);
    }

    function showSearchModal(tracks) {
      searchResults.innerHTML = '';
      if (tracks.length === 0) {
        searchResults.innerHTML = '<p style="text-align:center;color:var(--text2);padding:16px;">😔 Ничего не найдено.<br>Попробуй другое название или введи вручную.</p>';
      } else {
        tracks.forEach(track => {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `
            <img class="result-cover" src="${escapeHTML(track.cover)}" onerror="this.style.display='none'">
            <div class="result-info">
              <div class="result-name">${escapeHTML(track.name)}</div>
              <div class="result-artist">${escapeHTML(track.artist)} · ${track.source}</div>
            </div>
            ${track.preview ? `<button class="result-preview" data-preview="${escapeHTML(track.preview)}">▶️</button>` : ''}
          `;
          div.addEventListener('click', (e) => {
            if (e.target.closest('.result-preview')) return;
            selectTrack(track);
          });
          searchResults.appendChild(div);
        });

        searchResults.querySelectorAll('.result-preview').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            playPreview(btn.dataset.preview);
          });
        });
      }
      searchModal.classList.remove('hidden');
    }

    function selectTrack(track) {
      searchModal.classList.add('hidden');
      stopPreview();
      addSong(track);
    }

    function playPreview(url) {
      stopPreview();
      currentPreviewAudio = new Audio(url);
      currentPreviewAudio.volume = 0.7;
      currentPreviewAudio.play().catch(() => {});
    }

    function stopPreview() {
      if (currentPreviewAudio) { currentPreviewAudio.pause(); currentPreviewAudio = null; }
    }

    $('manualAddBtn').addEventListener('click', () => {
      searchModal.classList.add('hidden');
      stopPreview();
      const name = prompt("Название трека:");
      if (!name?.trim()) return;
      const artist = prompt("Исполнитель:") || 'Неизвестен';
      addSong({ id: 'm_' + Date.now(), name: name.trim(), artist: artist.trim(), cover: '', preview: '', source: 'Вручную' });
    });

    $('closeSearchBtn').addEventListener('click', () => {
      searchModal.classList.add('hidden');
      stopPreview();
    });

    const badWords = ['хуй','пизда','ебать','блядь','блять','сука','нахер','нахуй','пошёл','пошел','залупа','жопа','говно','мудак','пидор','пидорас','гандон','шлюха','fuck','shit','bitch','asshole','dick','pussy','cunt'];
    function hasBadWords(t) {
      const l = t.toLowerCase().replace(/[^а-яёa-z0-9 ]/gi, '');
      return badWords.some(w => l.includes(w.replace(/[^а-яёa-z0-9 ]/gi, '')));
    }

    searchBtn.addEventListener('click', async () => {
      const q = songInput.value.trim();
      if (!q) return alert("Введи название!");
      if (hasBadWords(q)) return alert("❌ Нецензурная лексика!");
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<svg class="emoji" style="color:#fff;"><use href="#emoji-clock"/></svg> Ищу...';
      const tracks = await searchTracks(q);
      searchBtn.disabled = false;
      searchBtn.innerHTML = '<svg class="emoji" style="color:#fff;"><use href="#emoji-search"/></svg> Найти';
      showSearchModal(tracks);
      songInput.value = '';
    });

    songInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') { e.preventDefault(); searchBtn.click(); }
    });

    // Добавление в базу
    async function addSong(track) {
      const s = (await get(settingsRef)).val() || {};
      if (s.votingPaused) return alert("⏸️ Пауза.");
      if (s.roundEndTime && Date.now() >= s.roundEndTime) return alert("⏰ Раунд завершён.");
      const songs = (await get(songsRef)).val() || {};
      if (Object.keys(songs).length >= 5) return alert("🎵 Максимум 5 треков!");
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      await set(ref(db, `songs/${id}`), {
        id, name: track.name, artist: track.artist,
        cover: track.cover, preview: track.preview, votes: 0
      });
    }

    // Настройки
    async function initSettings() {
      const snap = await get(settingsRef);
      if (!snap.exists()) {
        const now = Date.now();
        await set(settingsRef, {
          votingActive: true, votingPaused: false,
          roundEndTime: now + VOTING_DURATION * 1000,
          roundStarted: now, eventDate: '01.01.2025'
        });
      } else {
        const s = snap.val();
        if (s.eventDate) {
          headerDate.textContent = s.eventDate;
          adminDate.value = s.eventDate.split('.').reverse().join('-');
        }
      }
    }

    onValue(settingsRef, snap => {
      if (!snap.exists()) return;
      const s = snap.val();
      votingPaused = !!s.votingPaused;
      votingEndTime = s.roundEndTime || null;
      if (s.eventDate) headerDate.textContent = s.eventDate;
      updateUI();
    });

    // Объявления со звуком
    let lastAnnTimestamp = 0;
    onValue(annRef, snap => {
      if (!snap.exists()) return;
      const d = snap.val();
      if (d.message && d.timestamp && d.timestamp > lastAnnTimestamp) {
        lastAnnTimestamp = d.timestamp;
        showAnnouncement(d.message);
        setTimeout(() => remove(annRef), 500);
      }
    });

    function showAnnouncement(msg) {
      if (annTimeout) clearTimeout(annTimeout);
      notifySound.currentTime = 0;
      notifySound.play().catch(() => {});
      annMsg.textContent = msg;
      annOverlay.classList.remove('hidden', 'fade-out');
      annTimeout = setTimeout(() => {
        annOverlay.classList.add('fade-out');
        setTimeout(() => annOverlay.classList.add('hidden'), 800);
      }, 5000);
    }

    function updateUI() {
      const now = Date.now();
      const active = votingEndTime && now < votingEndTime && !votingPaused;
      searchBtn.disabled = !active;
      songInput.disabled = !active;
      statusBadge.textContent = votingPaused ? 'ПАУЗА' : (votingEndTime && now >= votingEndTime ? 'СТОП' : 'АКТИВНО');
      statusBadge.className = 'badge' + (active ? '' : ' off');
      document.querySelectorAll('.vote-btn').forEach(b => b.disabled = !active);
      updateTimer();
    }

    function updateTimer() {
      if (!votingEndTime) { timerDisplay.textContent = '--:--'; return; }
      const r = Math.max(0, Math.floor((votingEndTime - Date.now()) / 1000));
      timerDisplay.textContent = `${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;
      timerDisplay.classList.toggle('warning', r <= 60 && r > 0);
      if (r === 0) updateUI();
    }
    timerInterval = setInterval(updateTimer, 1000);

    // Голоса
    const SK = 'disco_voted_songs';
    function getVoted() { try { return JSON.parse(localStorage.getItem(SK)||'{}'); } catch { return {}; } }
    function markVoted(id) { const v=getVoted(); v[id]=true; localStorage.setItem(SK,JSON.stringify(v)); }
    function hasVoted(id) { return !!getVoted()[id]; }
    function clearVoted() { localStorage.removeItem(SK); }

    window.voteForSong = async function(id, votes) {
      const s = (await get(settingsRef)).val()||{};
      if (s.votingPaused) return alert("⏸️ Пауза.");
      if (s.roundEndTime && Date.now() >= s.roundEndTime) return alert("⏰ Время вышло.");
      if (hasVoted(id)) return alert("⏳ Уже лайкнул!");
      await update(ref(db, `songs/${id}`), { votes: votes + 1 });
      markVoted(id);
      return true;
    };

    window.playPreviewGlobal = function(url) {
      if (!url) return;
      stopPreview();
      playPreview(url);
    };

    // Отображение
    onValue(songsRef, snap => {
      trackList.innerHTML = '';
      topList.innerHTML = '';
      
      if (snap.exists()) {
        const songs = Object.values(snap.val()).sort((a,b) => b.votes - a.votes);
        
        // Топ-3
        const medals = ['gold', 'silver', 'bronze'];
        const medalEmojis = ['emoji-crown', 'emoji-star', 'emoji-fire'];
        const top3 = songs.slice(0, 3);
        
        if (top3.length > 0) {
          top3.forEach((track, i) => {
            const div = document.createElement('div');
            div.className = 'top-item' + (i === 0 ? ' winner-glow' : '');
            div.innerHTML = `
              <span class="top-rank ${medals[i]}">
                <svg class="emoji emoji-lg ${i === 0 ? 'crown' : ''}" style="color:var(--${medals[i]});">
                  <use href="#${medalEmojis[i]}"/>
                </svg>
              </span>
              <div class="top-info">
                <div class="top-name">${escapeHTML(track.name)}</div>
                <div class="top-artist">${escapeHTML(track.artist)}</div>
              </div>
              <span class="top-votes">
                <svg class="emoji" style="color:var(--accent);"><use href="#emoji-heart"/></svg>
                ${track.votes}
              </span>
            `;
            topList.appendChild(div);
          });
        } else {
          topList.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text2);font-size:0.8rem;">Пока нет треков в топе</div>';
        }

        // Все треки
        songs.forEach(track => {
          const div = document.createElement('div');
          div.className = 'track-item';
          div.innerHTML = `
            <img class="track-cover" src="${escapeHTML(track.cover)}" onerror="this.style.display='none'">
            <div class="track-info">
              <div class="track-name">${escapeHTML(track.name)}</div>
              <div class="track-artist">${escapeHTML(track.artist)}</div>
            </div>
            <div class="track-actions">
              ${track.preview ? `<button class="preview-btn" data-preview="${escapeHTML(track.preview)}">
                <svg class="emoji" style="color:var(--accent);"><use href="#emoji-music"/></svg>
              </button>` : ''}
              <button class="vote-btn ${hasVoted(track.id)?'voted':''}" data-id="${track.id}" data-votes="${track.votes}">
                <svg class="emoji" style="color:currentColor;"><use href="#emoji-heart"/></svg>
                <span>${track.votes}</span>
              </button>
            </div>`;
          trackList.appendChild(div);
        });

        trackList.querySelectorAll('.vote-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id=btn.dataset.id, v=parseInt(btn.dataset.votes);
            btn.style.transform='scale(1.2)'; setTimeout(()=>btn.style.transform='',150);
            if (await window.voteForSong(id, v)) {
              btn.classList.add('voted');
              btn.querySelector('span').textContent = v+1;
              btn.dataset.votes = v+1;
            }
          });
        });

        trackList.querySelectorAll('.preview-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            window.playPreviewGlobal(btn.dataset.preview);
          });
        });
      } else {
        trackList.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text2);font-size:0.85rem;">🎤 Пока никто не предложил трек.<br>Найди и добавь первый!</div>';
      }
      updateUI();
    });

    // Админка
    let clicks=0, ct=null;
    $('secretAvatar').addEventListener('click', () => {
      clicks++;
      if(ct) clearTimeout(ct);
      ct=setTimeout(()=>clicks=0,2000);
      if(clicks>=5){
        clicks=0;
        const pw=prompt("🔐 Пароль:");
        if(pw==="27172930") adminPanel.classList.remove('hidden');
        else if(pw!==null) alert("❌ Неверно!");
      }
    });

    $('saveDateBtn').addEventListener('click', async () => {
      const d = adminDate.value;
      if(!d) return;
      const disp = d.split('-').reverse().join('.');
      await update(settingsRef, { eventDate: disp });
      headerDate.textContent = disp;
    });

    $('sendAnnBtn').addEventListener('click', async () => {
      const msg = $('annInput').value.trim();
      if(!msg) return;
      await set(annRef, { message: msg, timestamp: Date.now() });
      $('annInput').value = '';
    });

    $('pauseBtn').addEventListener('click', async () => { await update(settingsRef, { votingPaused: true }); });
    $('resumeBtn').addEventListener('click', async () => { await update(settingsRef, { votingPaused: false }); });

    $('endRoundBtn').addEventListener('click', async () => {
      if(!confirm('⏹️ Завершить и удалить ВСЕ треки?')) return;
      await remove(songsRef);
      const now = Date.now();
      await set(settingsRef, {
        votingActive: true, votingPaused: false,
        roundEndTime: now + VOTING_DURATION * 1000,
        roundStarted: now, eventDate: headerDate.textContent
      });
      clearVoted();
      stopPreview();
    });

    $('resetVotesBtn').addEventListener('click', async () => {
      if(!confirm('🔄 Сбросить лайки?')) return;
      const snap = await get(songsRef);
      if(snap.exists()) {
        const u = {};
        Object.keys(snap.val()).forEach(k => u[`songs/${k}/votes`] = 0);
        await update(ref(db), u);
        clearVoted();
      }
    });

    function escapeHTML(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    initSettings();
  </script>
</body>
</html>
